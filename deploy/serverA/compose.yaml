name: qs-ai
services:
  qs-ai:
    image: ${QS_AI_IMAGE:?Set the immutable image tag}
    container_name: qs-ai
    restart: unless-stopped
    environment:
      QS_AI_ENVIRONMENT: production
    ports:
    - 127.0.0.1:18080:8000
    networks:
      backend:
        aliases:
        - qs-ai-grpc
        - qs-ai-api
    mem_limit: 1g
    cpus: '2.0'
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',
        timeout=3)
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    stop_grace_period: 210s
    volumes:
    - type: bind
      source: /data/infra/ssl/grpc/ca/ca-chain.crt
      target: /run/qs-ai-tls/ca-chain.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /data/infra/ssl/grpc/server/qs-ai-fullchain.crt
      target: /run/qs-ai-tls/qs-ai-fullchain.crt
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /data/infra/ssl/grpc/server/qs-ai.key
      target: /run/qs-ai-tls/qs-ai.key
      read_only: true
      bind:
        create_host_path: false
networks:
  backend:
    external: true
    name: infra-network
