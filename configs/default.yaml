# Shared non-secret defaults. Environment variables use QS_AI_ and __ for nesting.
http:
  host: 0.0.0.0
  port: 8000
  log_level: info
database:
  pool_size: 5
  max_overflow: 5
  pool_timeout: 3
  connect_timeout: 3
worker:
  health_file: /tmp/qs-ai-worker-health.json
  lease_seconds: 30
  concurrency: 1
  idle_seconds: 1
  max_backoff_seconds: 30
  shutdown_seconds: 130
generation:
  enabled: false
  profile_id: participant-scale-score-range-default
  profile_version: v6
  endpoint: null
  route: balanced_text_v1
  revision: v8
  provider: deepseek
  model: deepseek-v4-pro
  protocol: responses
  structured_output_mode: json_schema
  timeout_milliseconds: 120000
  max_output_tokens: 12000
  reasoning_effort: none
grpc:
  bind_address: 127.0.0.1:50061
  result_address: null
  access_address: null
  max_receive_bytes: 65536
  shutdown_grace_seconds: 5
  request_timeout_seconds: 5
  ca_file: null
  cert_file: null
  key_file: null
delivery:
  health_file: /tmp/qs-ai-delivery-health.json
  batch_size: 20
  max_retry_seconds: 60
  concurrency: 1
  idle_seconds: 1
  max_backoff_seconds: 30
  shutdown_seconds: 15
evaluation:
  enabled: false
  health_file: /tmp/qs-ai-evaluation-health.json
  concurrency: 1
  idle_seconds: 1
  max_backoff_seconds: 30
  shutdown_seconds: 130
