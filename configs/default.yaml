# Shared non-secret defaults. Environment variables use QS_AI_ and __ for nesting.
http:
  host: 0.0.0.0
  port: 8000
  log_level: info
database:
  pool_size: 5
  max_overflow: 5
  pool_timeout: 3
  connect_timeout: 3
worker:
  lease_seconds: 30
grpc:
  bind_address: 127.0.0.1:50061
  result_address: null
  max_receive_bytes: 65536
  shutdown_grace_seconds: 5
  request_timeout_seconds: 5
  ca_file: null
  cert_file: null
  key_file: null
delivery:
  batch_size: 20
  max_retry_seconds: 60
