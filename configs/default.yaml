# Shared non-secret defaults. Environment variables use QS_AI_ and __ for nesting.
http:
  host: 0.0.0.0
  port: 8000
  log_level: info
database:
  pool_size: 5
  max_overflow: 5
  pool_timeout: 3
  connect_timeout: 3
worker:
  health_file: /tmp/qs-ai-worker-health.json
  lease_seconds: 30
  concurrency: 1
  idle_seconds: 1
  max_backoff_seconds: 30
  shutdown_seconds: 130
generation:
  enabled: false
  endpoint: null
grpc:
  governance_enabled: false
  bind_address: 127.0.0.1:50061
  result_address: null
  access_address: null
  # Transport envelope; individual management commands remain bounded to 256 KiB.
  max_receive_bytes: 524288
  shutdown_grace_seconds: 5
  request_timeout_seconds: 5
  ca_file: null
  cert_file: null
  key_file: null
delivery:
  health_file: /tmp/qs-ai-delivery-health.json
  batch_size: 20
  max_retry_seconds: 60
  concurrency: 1
  idle_seconds: 1
  max_backoff_seconds: 30
  shutdown_seconds: 15
evaluation:
  enabled: false
  daily_provider_calls: 1024
  max_active_runs: 1
  health_file: /tmp/qs-ai-evaluation-health.json
  concurrency: 1
  idle_seconds: 1
  max_backoff_seconds: 30
  shutdown_seconds: 130
participant_capacity:
  daily_org: 500
  daily_user: 5
  daily_assessment: 3
  active_org: 10
  active_user: 2
  active_assessment: 1

# Verified models available in the solution editor; adding one requires adapter validation.
governance_models:
  - deepseek-v4-pro
