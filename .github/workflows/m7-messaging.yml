name: M7 messaging perimeter
on:
  push:
    branches: [main, codex/m7-messaging-adapter]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/qs_ai/application/integration/events.py'
      - 'src/qs_ai/infrastructure/persistence/mysql/result_outbox.py'
      - 'tests/integration/test_m7_delivery.py'
      - 'scripts/ci/rehearse_m7_cutover.py'
      - 'docs/m7-messaging.md'
      - '.github/workflows/m7-messaging.yml'
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/qs_ai/application/integration/events.py'
      - 'src/qs_ai/infrastructure/persistence/mysql/result_outbox.py'
      - 'tests/integration/test_m7_delivery.py'
      - 'scripts/ci/rehearse_m7_cutover.py'
      - 'docs/m7-messaging.md'
      - '.github/workflows/m7-messaging.yml'
permissions:
  contents: read
jobs:
  m7:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0.36', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: qs_ai
          MYSQL_USER: m7
          MYSQL_PASSWORD: m7_disposable_only
          MYSQL_ROOT_PASSWORD: m7_root_disposable_only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pm7_root_disposable_only --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      TZ: Asia/Shanghai
      QS_AI_DATABASE_URL: mysql+asyncmy://m7:m7_disposable_only@127.0.0.1:3306/qs_ai
      QS_AI_TEST_MYSQL_DSN: mysql://m7:m7_disposable_only@127.0.0.1:3306/qs_ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run ruff check src/qs_ai/application/integration/events.py src/qs_ai/infrastructure/persistence/mysql/result_outbox.py tests/integration/test_m7_delivery.py scripts/ci/rehearse_m7_cutover.py
      - run: uv run ruff format --check src/qs_ai/application/integration/events.py src/qs_ai/infrastructure/persistence/mysql/result_outbox.py tests/integration/test_m7_delivery.py scripts/ci/rehearse_m7_cutover.py
      - run: uv run mypy src/qs_ai/application/integration/events.py src/qs_ai/infrastructure/persistence/mysql/result_outbox.py
      - run: uv run python scripts/check_docs.py
      - run: uv run alembic upgrade head
        env:
          QS_AI_DATABASE_URL: mysql+asyncmy://root:m7_root_disposable_only@127.0.0.1:3306/qs_ai
      - name: Single-process, capacity and frozen receipt regression (synthetic)
        run: >-
          uv run pytest -q --junitxml=m7-unit.xml
          tests/test_legacy_delivery_retirement.py tests/test_grpc_mq_cutover.py
          tests/test_model_capacity.py tests/test_multi_provider_gateway.py
          tests/test_mbti_runtime.py tests/test_mbti_themes_input.py tests/test_single_server.py
      - name: Original transaction, durable MQ receipt and execution recovery (synthetic)
        run: >-
          uv run pytest -q --junitxml=m7-storage.xml
          tests/integration/test_m7_delivery.py tests/integration/test_result_outbox.py
          tests/integration/test_mq_admission.py::test_legacy_result_settles_only_with_atomic_original_business_ack
          tests/integration/test_mq_legacy_handoff.py
          tests/integration/test_execution_configurations.py tests/integration/test_evaluation_recovery.py
          tests/integration/test_evaluation_capacity_recovery.py
          tests/integration/test_interpretation.py::test_model_dispatch_is_durable_and_only_one_caller_can_send
          tests/integration/test_interpretation.py::test_model_response_survives_reclaim_without_redispatch
          tests/integration/test_interpretation.py::test_unacknowledged_dispatch_cannot_be_resent_or_overwritten_after_reclaim
          tests/integration/test_interpretation.py::test_restart_between_workflow_return_and_business_commit
          tests/integration/test_interpretation.py::test_takeover_cancel_and_stale_business_publication
          tests/integration/test_artifact_acceptance.py::test_cancelled_task_cannot_accept_late_artifact
      - name: Reject missing dependencies or skipped acceptance
        run: |
          uv run python - <<'PY'
          import xml.etree.ElementTree as ET
          for file in ('m7-unit.xml', 'm7-storage.xml'):
              root = ET.parse(file).getroot()
              suites = list(root.iter('testsuite'))
              cases = list(root.iter('testcase'))
              if not suites or not cases or sum(int(s.get('tests', 0)) for s in suites) <= 0:
                  raise SystemExit(f'Required acceptance report is empty: {file}')
              if any(int(s.get(k, 0)) != 0 for s in suites for k in ('skipped', 'errors', 'failures')):
                  raise SystemExit(f'Required acceptance contains skipped or failed cases: {file}')
              if any(list(root.iter(k)) for k in ('skipped', 'error', 'failure')):
                  raise SystemExit(f'Required acceptance contains unsuccessful test cases: {file}')
          PY
      - run: uv build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m7-qs-ai-mysql-${{ matrix.mysql }}
          path: |
            m7-unit.xml
            m7-storage.xml
            dist/*
          if-no-files-found: error
