name: AI messaging isolated
on:
  workflow_dispatch:
  push:
    branches: [codex/ai-mq-adapter]
permissions:
  contents: read
jobs:
  messaging:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            mysql: '8.0.36'
          - python: '3.13'
            mysql: '8.4'
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_DATABASE: qs_ai
          MYSQL_USER: qs_ai
          MYSQL_PASSWORD: qs_ai_local
          MYSQL_ROOT_PASSWORD: qs_ai_local_root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pqs_ai_local_root --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      QS_AI_DATABASE_URL: mysql+asyncmy://qs_ai:qs_ai_local@127.0.0.1:3306/qs_ai
      QS_AI_TEST_MYSQL_DSN: mysql://qs_ai:qs_ai_local@127.0.0.1:3306/qs_ai
      QS_MQ_MYSQL_URL: mysql+asyncmy://qs_ai:qs_ai_local@127.0.0.1:3306/qs_mq
      QS_MQ_NSQ_TCP_ADDRESS: 127.0.0.1:4150
      QS_MQ_NSQ_HTTP_URL: http://127.0.0.1:4151
      QS_MQ_CONTRACT_PROBE: ${{ github.workspace }}/.interop/qs-mq-probe
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run python scripts/generate_messaging_proto.py --check
      - run: uv run alembic upgrade head && uv run alembic check
      - name: Create separate disposable adapter database
        run: |
          uv run python - <<'PYTHON'
          import asyncio
          import asyncmy
          async def prepare():
              connection = await asyncmy.connect(host='127.0.0.1',user='root',password='qs_ai_local_root',autocommit=True)
              try:
                  async with connection.cursor() as cursor:
                      await cursor.execute('CREATE DATABASE qs_mq')
                      await cursor.execute("GRANT ALL ON qs_mq.* TO 'qs_ai'@'%'")
              finally:
                  connection.close()
          asyncio.run(prepare())
          PYTHON
      - uses: actions/checkout@v4
        with:
          repository: FangcunMount/qs-server
          ref: 3a5a58fdc2d4b8c52f33bc1d4abb1bc735f9ab60
          path: .interop/qs-mq
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: .interop/qs-mq/go.sum
      - run: (cd .interop/qs-mq && GOWORK=off go build -o ../qs-mq-probe ./tests/ai_messaging_probe)
      - name: Start dedicated NSQ 1.3.0
        run: |
          docker run -d --name ai-mq-ci -p 127.0.0.1:4150:4150 -p 127.0.0.1:4151:4151 nsqio/nsq:v1.3.0 /nsqd --data-path=/tmp --broadcast-address=127.0.0.1 --max-msg-size=262144 --mem-queue-size=3000
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4151/ping; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify required MQ risk scenarios on final dependency
        run: |
          mkdir -p artifacts
          uv run pytest -q tests/test_messaging_runtime.py tests/test_grpc_mq_cutover.py tests/test_mq_contract.py tests/test_mq_failure.py tests/integration/test_mq_topology.py tests/integration/test_mq_storage.py tests/integration/test_mq_admission.py tests/integration/test_mq_worker_events.py --junitxml=artifacts/mq.xml
          uv run python scripts/ci/verify_mq_report.py artifacts/mq.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-mq-${{ matrix.python }}-${{ matrix.mysql }}
          path: artifacts/
          if-no-files-found: error
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: RELEASE_SHA=${{ github.sha }}
          load: true
          tags: qs-ai:mq-ci
          cache-from: type=gha,scope=qs-ai-mq-ci
          cache-to: type=gha,mode=max,scope=qs-ai-mq-ci
      - name: Verify standard image and one process (MQ disabled)
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp -e QS_AI_ENVIRONMENT=production qs-ai:mq-ci /app/.venv/bin/python -c 'import os; from qs_ai.config import Settings; from qs_ai.bootstrap.container import create_container; assert os.getuid() != 0; create_container(Settings())'
          python3 scripts/ci/smoke_single_process.py qs-ai:mq-ci
