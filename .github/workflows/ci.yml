name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        mysql-version: ['8.0.36', '8.4']
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:${{ matrix.mysql-version }}
        env:
          MYSQL_DATABASE: qs_ai
          MYSQL_USER: qs_ai
          MYSQL_PASSWORD: qs_ai_local
          MYSQL_ROOT_PASSWORD: qs_ai_local_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pqs_ai_local_root --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      QS_AI_DATABASE_URL: mysql+asyncmy://qs_ai:qs_ai_local@127.0.0.1:3306/qs_ai
      QS_AI_TEST_MYSQL_DSN: mysql://qs_ai:qs_ai_local@127.0.0.1:3306/qs_ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/generate_qs_proto.py --check
      - run: uv run python scripts/generate_workflow_proto.py --check
      - run: uv run python scripts/check_docs.py
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run python -m qs_ai.bootstrap.database_check --require-head
      - uses: actions/checkout@v4
        with:
          repository: FangcunMount/qs-server
          ref: 1b52081ea42c94dc5653ce91e8c7a1db9f85fc44
          path: .interop/qs-server
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: .interop/qs-server/go.sum
      - uses: actions/checkout@v4
        with:
          repository: FangcunMount/qs-server
          ref: b13c21e02d0d2abf97062c221aeb69565047f419
          path: .interop/qs-artifact
      - uses: actions/checkout@v4
        with:
          repository: FangcunMount/qs-server
          ref: 9ec92dd893b5011e5fad43de2536e709f2ab9a8b
          path: .interop/qs-governance
      - name: Verify migrated executable Prompt packages
        run: |
          uv run python scripts/export_qs_prompts.py .interop/qs-server --check
          cmp integrations/qs_server/schemas/ai-explanation-output-v1.schema.json .interop/qs-server/api/schema/interpretation/ai-explanation-output-v1.schema.json
      - name: Build pinned QS bridge and initialize separate test database
        run: |
          (cd .interop/qs-server && go build -o ../qs-ai-bridge ./cmd/qs-ai-bridge)
          (cd .interop/qs-artifact && go build -o ../qs-ai-artifact-bridge ./cmd/qs-ai-bridge)
          (cd .interop/qs-server && go build -o ../qs-ai-access-probe ./internal/apiserver/transport/grpc/service/testdata/accessprobe)
          uv run python - <<'PYTHON'
          import asyncio
          from pathlib import Path
          import asyncmy
          async def prepare():
              connection = await asyncmy.connect(host="127.0.0.1", user="root", password="qs_ai_local_root")
              try:
                  async with connection.cursor() as cursor:
                      await cursor.execute("CREATE DATABASE qs_gateway")
                      await cursor.execute("GRANT ALL ON qs_gateway.* TO 'qs_ai'@'%'")
                      await cursor.execute("USE qs_gateway")
                      sql = Path(".interop/qs-server/internal/pkg/migration/migrations/mysql/000072_ai_bridge_delivery.up.sql").read_text()
                      for statement in sql.split(";"):
                          if statement.strip():
                              await cursor.execute(statement)
              finally:
                  connection.close()
          asyncio.run(prepare())
          PYTHON
      - run: uv run pytest
        env:
          QS_AI_BRIDGE_BIN: ${{ github.workspace }}/.interop/qs-ai-bridge
          QS_AI_ARTIFACT_BRIDGE_BIN: ${{ github.workspace }}/.interop/qs-ai-artifact-bridge
          QS_AI_ACCESS_PROBE_BIN: ${{ github.workspace }}/.interop/qs-ai-access-probe
          QS_AI_PROMPT_SOURCE: ${{ github.workspace }}/.interop/qs-server
          QS_AI_GOVERNANCE_SOURCE: ${{ github.workspace }}/.interop/qs-governance
          QS_AI_TEST_QS_MYSQL_DSN: mysql+asyncmy://qs_ai:qs_ai_local@127.0.0.1:3306/qs_gateway
          QS_AI_TEST_QS_GO_DSN: qs_ai:qs_ai_local@tcp(127.0.0.1:3306)/qs_gateway?parseTime=true
      - run: uv build
      - name: Verify packaged configuration and Prompts outside repository
        run: |
          uv run python - <<'PYTHON'
          import os
          import subprocess
          import sys
          import tempfile
          import zipfile
          from pathlib import Path
          wheel = next(Path("dist").glob("*.whl"))
          with tempfile.TemporaryDirectory() as directory:
              with zipfile.ZipFile(wheel) as archive:
                  archive.extractall(directory)
              environment = {**os.environ, "PYTHONPATH": directory, "QS_AI_ENVIRONMENT": "production"}
              subprocess.run(
                  [sys.executable, "-c", "from qs_ai.config import Settings; s=Settings(); assert s.http.host == '0.0.0.0'; assert s.worker.lease_seconds == 30"],
                  cwd=directory, env=environment, check=True,
              )
              subprocess.run(
                  [sys.executable, "-c", "from qs_ai.infrastructure.qs_server.prompts import load_prompt; assert load_prompt('cross-dimension-participant-scale', 'v6').version == 'v6'"],
                  cwd=directory, env=environment, check=True,
              )
              subprocess.run(
                  [sys.executable, "-c", "from qs_ai.infrastructure.qs_server.profiles import load_migrated_release; assert load_migrated_release('participant-scale-score-range-default', 'v6').provider_route == 'balanced_text_v1'"],
                  cwd=directory, env=environment, check=True,
              )
              subprocess.run(
                  [sys.executable, "-c", "from qs_ai.infrastructure.qs_server.output import QSOutputParser; QSOutputParser()"],
                  cwd=directory, env=environment, check=True,
              )
          PYTHON
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: qs-ai:ci
          cache-from: type=gha,scope=qs-ai-ci
          cache-to: type=gha,mode=max,scope=qs-ai-ci
      - name: Check restricted production image
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp -e QS_AI_ENVIRONMENT=production qs-ai:ci /app/.venv/bin/python -c 'import os; from qs_ai.config import Settings; from qs_ai.bootstrap.container import create_container; assert os.getuid() != 0; create_container(Settings())'
          docker run -d --name qs-ai-smoke --read-only --tmpfs /tmp -p 127.0.0.1:18080:8000 -e QS_AI_ENVIRONMENT=production qs-ai:ci
          trap 'docker rm -f qs-ai-smoke >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/healthz
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/readyz)" = 503
