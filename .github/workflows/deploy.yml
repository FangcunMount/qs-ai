name: Deploy serverA
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [deploy, rollback]
        default: deploy
      revision:
        description: 'Full main commit SHA; empty selects this workflow commit'
        required: false
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: qs-ai-serverA
  cancel-in-progress: false
jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && vars.AUTO_DEPLOY_ENABLED == 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.gate.outputs.revision }}
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Test image retention policy
        run: python3 scripts/cd/test_image_retention.py

      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event_name }}
          REQUESTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.revision || github.sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$REQUESTED_SHA" origin/main
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$REQUESTED_SHA" --event push --json conclusion --jq 'any(.[]; .conclusion == "success")' | grep -qx true
          echo "revision=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          marker=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == .workflow_run.repository_id and (.name | startswith("qs-ai-deployed-")))] | sort_by(.created_at) | reverse | .[0].name // ""')
          baseline="${marker#qs-ai-deployed-}"
          baseline="${baseline%%-*}"
          if [ "$TRIGGER" = workflow_dispatch ] || [ -z "$marker" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
            echo "deploy=$(python3 scripts/cd/deploy_scope.py "$REQUESTED_SHA" "$baseline")" >> "$GITHUB_OUTPUT"
          fi
  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true' && inputs.operation != 'rollback'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.revision }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          build-args: RELEASE_SHA=${{ needs.gate.outputs.revision }}
          platforms: linux/amd64
          push: true
          # ACR rejects BuildKit attestation manifests; retain digest and revision checks.
          provenance: false
          sbom: false
          tags: ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ secrets.ALIYUN_ACR_NAMESPACE }}/qs-ai:${{ needs.gate.outputs.revision }}
          labels: org.opencontainers.image.revision=${{ needs.gate.outputs.revision }}
          cache-from: type=gha,scope=qs-ai
          cache-to: type=gha,mode=max,scope=qs-ai
  deploy:
    needs: [gate, build]
    if: >-
      always() && needs.gate.result == 'success' && needs.gate.outputs.deploy == 'true' &&
      (needs.build.result == 'success' ||
       (inputs.operation == 'rollback' && needs.build.result == 'skipped'))
    runs-on:
      group: qlume
      labels: [self-hosted, macOS, ARM64]
    environment: production
    steps:
      - name: Report runner disk availability
        run: df -h "$RUNNER_TEMP"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.revision }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.13'
          python-version: '3.11'
      - run: uv sync --locked --no-dev
      - name: Export and deploy verified image
        id: release
        env:
          DEPLOY_SHA: ${{ needs.gate.outputs.revision }}
          DEPLOY_OPERATION: ${{ inputs.operation || 'deploy' }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          ALIYUN_ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ALIYUN_ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
          ALIYUN_ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT || '3306' }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_DBNAME: ${{ secrets.MYSQL_DBNAME }}
          MYSQL_USERNAME: ${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          QS_AI_EXECUTION_ENABLED: ${{ vars.QS_AI_EXECUTION_ENABLED || 'false' }}
          QS_AI_GOVERNANCE_ENABLED: ${{ vars.QS_AI_GOVERNANCE_ENABLED || 'false' }}
          QS_AI_EVALUATION_ENABLED: ${{ vars.QS_AI_EVALUATION_ENABLED || 'false' }}
          QS_AI_MODEL_V2_WRITES_ENABLED: ${{ vars.QS_AI_MODEL_V2_WRITES_ENABLED || 'false' }}
          QS_AI_MODEL_ENDPOINT: ${{ vars.QS_AI_MODEL_ENDPOINT }}
          QS_AI_MODEL_API_KEY: ${{ secrets.QS_AI_MODEL_API_KEY }}
          QS_AI_DEEPSEEK_API_KEY: ${{ secrets.QS_AI_DEEPSEEK_API_KEY }}
          QS_AI_ZHIPU_API_KEY: ${{ secrets.QS_AI_ZHIPU_API_KEY }}
          QS_AI_QS_ADDRESS: ${{ vars.QS_AI_QS_ADDRESS || 'qs-apiserver:9090' }}
          SVRA_HOST: ${{ vars.SVRA_PUBLIC_HOST || vars.SVRA_HOST || secrets.SVRA_HOST }}
          SVRA_USERNAME: ${{ vars.SVRA_USERNAME || secrets.SVRA_USERNAME }}
          SVRA_SSH_PORT: ${{ vars.SVRA_SSH_PORT || secrets.SVRA_SSH_PORT || '22' }}
          SVRA_SSH_KEY: ${{ secrets.SVR_MINI_SSH_KEY || secrets.SVRA_SSH_KEY }}
          SVRA_HOST_PUBLIC_KEY: ${{ vars.SVRA_HOST_PUBLIC_KEY }}
        run: uv run --no-dev python scripts/cd/deploy.py
      - name: Record verified deployment baseline
        uses: actions/upload-artifact@v4
        with:
          name: qs-ai-deployed-${{ steps.release.outputs.actual_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Release summary
        if: success()
        env:
          REVISION: ${{ needs.gate.outputs.revision }}
          OPERATION: ${{ inputs.operation || 'deploy' }}
        run: |
          printf 'Operation: %s\n\nWorkflow source: `%s`\n\nTarget: serverA\n' "$OPERATION" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
