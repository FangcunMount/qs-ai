name: qs-ai-local
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: qs_ai
      MYSQL_USER: qs_ai
      MYSQL_PASSWORD: qs_ai_local
      MYSQL_ROOT_PASSWORD: qs_ai_local_root
    ports:
      - "127.0.0.1:13316:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  mysql_data:
